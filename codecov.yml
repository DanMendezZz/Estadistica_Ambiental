coverage:
  status:
    project:
      default:
        target: 70%          # umbral mínimo global (espacial usa deps opcionales)
        threshold: 5%        # tolerancia de caída entre commits
    patch:
      default:
        target: 60%          # cobertura mínima en código nuevo de cada PR

  # Ignorar módulos con dependencias opcionales pesadas
  ignore:
    - "src/estadistica_ambiental/predictive/deep.py"
    - "src/estadistica_ambiental/features/climate.py"
    # bayesian.py: cobertura real ~97% (PRs A/B de #11), pero sin
    # `after_n_builds` un fallo de instalación de pymc en CI (job sin
    # continue-on-error) deja el upload de coverage-bayes.xml sin subir de
    # forma silenciosa (fail_ci_if_error: false) y el status cae a la
    # cobertura real del archivo sin pymc (~11%, ~270 statements). Sacarlo
    # de acá requiere agregar ese guard primero -- ver issue de seguimiento.
    - "src/estadistica_ambiental/predictive/bayesian.py"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
