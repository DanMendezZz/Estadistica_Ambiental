name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "adapt-**"
      - "import-**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Linting y formato
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.3"

      - name: Check lint
        run: ruff check src/ tests/

      - name: Check format
        run: ruff format --check src/ tests/

  # ─────────────────────────────────────────────
  # JOB 2: Tests — matriz Python × OS
  # ─────────────────────────────────────────────
  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
        exclude:
          # Python 3.10 solo en ubuntu para reducir tiempo de CI
          - os: windows-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run core tests
        run: >
          python -m pytest tests/
          --tb=short
          -q
          --cov=src/estadistica_ambiental
          --cov-report=xml:coverage.xml
          --cov-report=term-missing

      - name: Upload coverage to Codecov
        # Solo desde ubuntu + py3.12 para no duplicar reportes
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 3: Tests con extras ML (xgboost / lightgbm)
  # ─────────────────────────────────────────────
  test-ml:
    name: Tests con [ml]
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install con extras ML
        run: pip install -e ".[dev,ml]"

      - name: Run tests con cobertura ML
        run: >
          python -m pytest tests/
          --tb=short -q
          --cov=src/estadistica_ambiental
          --cov-report=xml:coverage-ml.xml

      - name: Upload coverage to Codecov
        # Varios tests de tests/test_predictive.py se saltan por-test (no el
        # archivo entero) en JOB 2 vía pytest.importorskip("xgboost"/...) --
        # sin este upload, las ramas de ml.py/registry.py/optimization/
        # bayes_opt.py que solo corren con xgboost/lightgbm instalados no
        # cuentan para la cobertura reportada (mismo gap que tenían
        # test-bayes/test-spatial antes del PR #40).
        uses: codecov/codecov-action@v7
        with:
          files: coverage-ml.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 3b: Tests con extras Deep Learning (torch)
  # ─────────────────────────────────────────────
  test-deep:
    name: Tests con [deep]
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install con extras Deep Learning
        run: pip install -e ".[dev,deep]"

      - name: Run tests con cobertura Deep Learning
        # Sin upload a Codecov a propósito: predictive/deep.py está en el
        # `omit` de [tool.coverage.run] en pyproject.toml, así que este
        # reporte no mide nada que coverage.xml (JOB 2) no mida ya -- subirlo
        # sería un upload sin información nueva. Si algún día se decide medir
        # deep.py de verdad, sacarlo del omit es la decisión previa real.
        run: >
          python -m pytest tests/
          --tb=short -q
          --cov=src/estadistica_ambiental
          --cov-report=xml:coverage-deep.xml

  # ─────────────────────────────────────────────
  # JOB 3c: Tests con extras Bayesianos (pymc / arviz)
  # ─────────────────────────────────────────────
  test-bayes:
    name: Tests con [bayes]
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install con extras Bayesianos
        run: pip install -e ".[dev,bayes]"

      - name: Run tests con cobertura Bayesiana
        run: >
          python -m pytest tests/
          --tb=short -q
          --cov=src/estadistica_ambiental
          --cov-report=xml:coverage-bayes.xml

      - name: Upload coverage to Codecov
        # test_bayesian.py se salta entero en JOB 2 (solo instala [dev], sin
        # pymc) via pytest.importorskip -- sin este upload, nada de lo que
        # cubre esa suite cuenta para la cobertura reportada.
        uses: codecov/codecov-action@v7
        with:
          files: coverage-bayes.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 4: Tests con dependencias espaciales
  # ─────────────────────────────────────────────
  test-spatial:
    name: Tests con [spatial]
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + dev
        run: pip install -e ".[dev]"

      - name: Install spatial extras
        # continue-on-error expone el fallo en la UI sin cancelar el job.
        # Los tests espaciales usan pytest.importorskip y se saltean si alguna no instala.
        # Instala el extra [spatial] real de pyproject.toml (incluye rasterio)
        # en vez de una lista manual paralela -- la lista anterior había
        # divergido (issue #41) y, además, un step separado para "aislar" el
        # build de rasterio no aislaba nada: rioxarray y contextily lo traen
        # como dependencia dura igual, así que ya entraba en el mismo batch
        # sin querer. h5netcdf/h5py aparte -- viven en [netcdf] junto a
        # netcdf4, que NO se instala porque ningún test lo usa (todos los
        # NetCDF de prueba usan engine="h5netcdf" explícito) y tiene sus
        # propios requisitos de build nativos sin probar en CI.
        continue-on-error: true
        run: pip install -e ".[spatial]" h5netcdf h5py

      - name: Run tests (incluyendo espaciales)
        run: >
          python -m pytest tests/
          --tb=short -q
          --cov=src/estadistica_ambiental
          --cov-report=xml:coverage-spatial.xml

      - name: Upload coverage to Codecov
        # Único job con geopandas/rasterio/xarray/libpysal instalados -- sin
        # esto, todo lo que esos tests cubren vía pytest.importorskip queda
        # invisible para la cobertura reportada (JOB 2 no tiene estas deps).
        uses: codecov/codecov-action@v7
        with:
          files: coverage-spatial.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 4: Auditoría de seguridad
  # ─────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit core dependencies
        # No falla el CI si hay vulnerabilidades — solo las reporta
        run: pip-audit -r requirements.txt --progress-spinner off || true

      - name: Audit installed packages
        run: |
          pip install -e ".[dev]"
          pip-audit --progress-spinner off || true

  # ─────────────────────────────────────────────
  # JOB 5: Validar notebooks (sintaxis JSON)
  # ─────────────────────────────────────────────
  notebooks:
    name: Validate notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check notebook JSON validity
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          errors = []
          for nb in pathlib.Path("notebooks").rglob("*.ipynb"):
              try:
                  data = json.loads(nb.read_text(encoding="utf-8"))
                  assert data.get("nbformat") == 4
              except Exception as e:
                  errors.append(f"{nb}: {e}")
          if errors:
              print("Notebooks con errores:")
              for e in errors: print(f"  {e}")
              sys.exit(1)
          print(f"OK: {len(list(pathlib.Path('notebooks').rglob('*.ipynb')))} notebooks validados")
          EOF
