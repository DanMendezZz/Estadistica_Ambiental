name: Docs — mkdocs site

# Solo VALIDA que el sitio compila (mkdocs --strict). El despliegue a Pages lo hace
# pages.yml: Pages está en modo "workflow" y no sirve la rama gh-pages.

on:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "src/**"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "src/**"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-mkdocs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar build de mkdocs (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with docs extras
        run: pip install -e ".[docs]"

      - name: Build JupyterLite (Pyodide notebooks)
        run: |
          jupyter lite build \
            --contents docs/lite/files \
            --output-dir docs/lite/_dist

      - name: Validate mkdocs build (strict)
        run: mkdocs build --strict
