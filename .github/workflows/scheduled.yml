name: Scheduled checks

on:
  schedule:
    # Lunes a las 08:00 UTC (03:00 Bogotá)
    - cron: "0 8 * * 1"
  workflow_dispatch:   # permite ejecución manual desde GitHub UI

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Drift de dependencias
  # Verifica que los tests pasen con las últimas versiones disponibles
  # ─────────────────────────────────────────────
  dependency-drift:
    name: Dependency drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install latest versions (sin pinning)
        run: pip install -e ".[dev]" --upgrade

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

      - name: Report drift
        if: failure()
        run: |
          echo "⚠️ Los tests fallaron con las últimas versiones de dependencias."
          echo "Revisar si hay breaking changes en pandas, statsmodels, xgboost, etc."
          pip list --outdated

  # ─────────────────────────────────────────────
  # JOB 2: Auditoría de seguridad semanal
  # ─────────────────────────────────────────────
  security-audit:
    name: Weekly security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit + safety
        run: pip install pip-audit

      - name: Audit requirements
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Create issue si hay vulnerabilidades (evita duplicados)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
            })
            if (abiertos.data.length > 0) {
              console.log('Ya hay un issue abierto de vulnerabilidades, no se crea otro.')
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Vulnerabilidades detectadas — ${new Date().toISOString().split('T')[0]}`,
              body: 'La auditoría semanal de seguridad detectó vulnerabilidades en las dependencias.\nRevisar el workflow "Scheduled checks" para detalles.',
              labels: ['security', 'dependencies']
            })

  # ─────────────────────────────────────────────
  # JOB 3: Vigencia de la trazabilidad normativa (NORMA_FUENTES, ver ADR-020)
  # ─────────────────────────────────────────────
  normativa-audit:
    name: Auditoría semanal de vigencia normativa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run normativa tests
        # -m "" anula el filtro por defecto de addopts (que excluye
        # normativa_vigencia de la suite normal) para correrlo aquí a proposito.
        run: python -m pytest tests/test_config_normas.py -q --tb=short -m ""

      - name: Create issue si una verificación normativa venció (evita duplicados)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'normativa,compliance',
            })
            if (abiertos.data.length > 0) {
              console.log('Ya hay un issue abierto de verificacion normativa, no se crea otro.')
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Verificación normativa vencida: ${new Date().toISOString().split('T')[0]}`,
              body: 'tests/test_config_normas.py falló: un umbral en NORMA_FUENTES no tiene fuente o su fecha_verificacion supera 12 meses. Revisar config.py y ADR-020.',
              labels: ['normativa', 'compliance']
            })

  # ─────────────────────────────────────────────
  # JOB 4: Drift con versiones pre-release
  # Informativo — detecta breaking changes antes de que lleguen a estable
  # ─────────────────────────────────────────────
  dependency-drift-pre:
    name: Dependency drift check (pre-release)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pre-release versions
        run: pip install -e ".[dev]" --pre --upgrade

      - name: Run tests
        run: python -m pytest tests/ -q --tb=line
